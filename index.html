<!doctype html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="சாதனத்திலேயே சேமிக்கப்படும் எளிய செய்யவேண்டியவை பட்டியல் செயலி."
    />
    <title>செய்யவேண்டியவை</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <script src="./src/scripts/app.js" defer></script>
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <section class="todo-card" aria-label="செய்யவேண்டியவை செயலி">
        <h1 id="app-title" class="sr-only">செய்யவேண்டியவை பட்டியல்</h1>

        <form class="todo-form" autocomplete="off">
          <label class="sr-only" for="todo-input">புதிய செயல்</label>
          <input
            id="todo-input"
            class="todo-input"
            type="text"
            name="todo"
            maxlength="120"
            placeholder="செய்ய வேண்டியதை நிரப்புக..."
            aria-label="புதிய செயல்"
            required
          />
          <button class="todo-button" type="submit">சேர்த்திடுக</button>
        </form>

        <div class="toolbar" aria-label="பட்டியல் பிரிவுகள்">
          <div class="filters" role="group" aria-label="பிரிவுகள்">
            <button
              class="filter-button active"
              type="button"
              data-filter="all"
            >
              அனைத்தும்
            </button>
            <button class="filter-button" type="button" data-filter="active">
              செய்யவேண்டியவை
            </button>
            <button class="filter-button" type="button" data-filter="completed">
              முடிந்தவை
            </button>
          </div>
          <button class="clear-button" type="button">முடிந்தவற்றைத் துடைத்திடுக</button>
        </div>

        <div class="todo-meta" aria-live="polite">
          <span class="todo-count">0 செயல்கள்</span>
          <span class="storage-note">இந்த உலாவியிலேயே சேமிக்கப்படுகிறது</span>
        </div>

        <ul class="todo-list" aria-label="செயல்கள் பட்டியல்"></ul>

        <p class="empty-state">செயல்கள் ஏதுமில்லை. புதிய ஒன்றைச் சேர்க்கவும்.</p>
      </section>
    </main>
  </body>
</html>
